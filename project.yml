name: Needle
options:
  bundleIdPrefix: com.yorben
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 34LM5DW4G4
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  NeedleBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Bridge
    settings:
      base:
        PRODUCT_NAME: NeedleBridge
        EXECUTABLE_PREFIX: lib
        CLANG_ENABLE_OBJC_ARC: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        OTHER_LDFLAGS: ["-framework", "Foundation"]
  Needle:
    type: application
    platform: macOS
    sources:
      - path: Needle
        type: syncedFolder
    dependencies:
      - target: NeedleBridge
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: Needle
        CFBundleDisplayName: Needle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: © 2026 Yorben Vander Sleyen
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yorben.needle
        PRODUCT_NAME: Needle
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
  NeedleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NeedleTests
        type: syncedFolder
    dependencies:
      - target: Needle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yorben.needleTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Needle.app/Contents/MacOS/Needle
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Needle:
    build:
      targets:
        Needle: all
        NeedleTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeedleTests
    archive:
      config: Release
